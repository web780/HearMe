<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HearMe 💙</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    :root {
      --blue: #4f7cff;
      --blue-dark: #315ee8;
      --blue-light: #eef4ff;
      --text: #182033;
      --muted: #788196;
      --bg: #f5f7fb;
      --card: #ffffff;
      --border: #e7eaf1;
      --danger: #ef5350;
      --success: #35a66f;
      --shadow: 0 10px 30px rgba(32, 48, 86, 0.08);
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    button,
    input,
    textarea,
    select {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* ---------- LANDING ---------- */

    #landing {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .landing-nav {
      height: 72px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 6%;
      background: white;
      border-bottom: 1px solid var(--border);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 9px;
      font-size: 23px;
      font-weight: 800;
      color: var(--text);
    }

    .logo-heart {
      width: 39px;
      height: 39px;
      border-radius: 13px;
      background: var(--blue);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .nav-login {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 10px 18px;
      border-radius: 12px;
      font-weight: 700;
    }

    .hero {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 70px 20px;
    }

    .hero-inner {
      width: 100%;
      max-width: 900px;
      text-align: center;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      background: var(--blue-light);
      color: var(--blue-dark);
      padding: 8px 14px;
      border-radius: 999px;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(40px, 8vw, 76px);
      line-height: 1.02;
      letter-spacing: -3px;
      margin-bottom: 22px;
    }

    .hero h1 span {
      color: var(--blue);
    }

    .hero p {
      max-width: 650px;
      margin: 0 auto 30px;
      color: var(--muted);
      font-size: 18px;
      line-height: 1.7;
    }

    .hero-actions {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
    }

    .primary-btn {
      border: none;
      background: var(--blue);
      color: white;
      padding: 14px 24px;
      border-radius: 14px;
      font-weight: 800;
      transition: .2s;
    }

    .primary-btn:hover {
      background: var(--blue-dark);
      transform: translateY(-1px);
    }

    .secondary-btn {
      border: 1px solid var(--border);
      background: white;
      color: var(--text);
      padding: 14px 24px;
      border-radius: 14px;
      font-weight: 800;
    }

    .features {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      max-width: 850px;
      margin: 45px auto 0;
    }

    .feature {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 22px;
      text-align: left;
      box-shadow: var(--shadow);
    }

    .feature-icon {
      font-size: 25px;
      margin-bottom: 12px;
    }

    .feature h3 {
      margin-bottom: 6px;
      font-size: 16px;
    }

    .feature p {
      margin: 0;
      font-size: 13px;
      line-height: 1.5;
    }

    /* ---------- AUTH ---------- */

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 25px;
      background: var(--bg);
    }

    .auth-card {
      width: 100%;
      max-width: 440px;
      background: white;
      border: 1px solid var(--border);
      border-radius: 25px;
      padding: 30px;
      box-shadow: var(--shadow);
    }

    .auth-logo {
      display: flex;
      justify-content: center;
      margin-bottom: 22px;
    }

    .auth-card h2 {
      text-align: center;
      font-size: 28px;
      margin-bottom: 7px;
    }

    .auth-subtitle {
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      margin-bottom: 25px;
    }

    .tabs {
      display: grid;
      grid-template-columns: 1fr 1fr;
      background: #f2f4f8;
      padding: 4px;
      border-radius: 12px;
      margin-bottom: 22px;
    }

    .tab {
      border: none;
      background: transparent;
      padding: 11px;
      border-radius: 9px;
      font-weight: 700;
      color: var(--muted);
    }

    .tab.active {
      background: white;
      color: var(--text);
      box-shadow: 0 2px 8px rgba(0,0,0,.06);
    }

    .form-group {
      margin-bottom: 15px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 700;
      margin-bottom: 7px;
    }

    .form-input,
    .form-textarea,
    .form-select {
      width: 100%;
      border: 1px solid var(--border);
      background: #fafbfe;
      padding: 13px 14px;
      border-radius: 12px;
      outline: none;
      color: var(--text);
    }

    .form-input:focus,
    .form-textarea:focus,
    .form-select:focus {
      border-color: var(--blue);
      background: white;
    }

    .form-textarea {
      resize: vertical;
      min-height: 130px;
    }

    .auth-submit {
      width: 100%;
      margin-top: 5px;
    }

    .back-btn {
      width: 100%;
      margin-top: 10px;
      border: none;
      background: transparent;
      color: var(--muted);
      padding: 10px;
    }

    .auth-message {
      font-size: 13px;
      text-align: center;
      margin-top: 13px;
      color: var(--danger);
      line-height: 1.5;
    }

    /* ---------- APP ---------- */

    #app {
      min-height: 100vh;
    }

    .app-header {
      height: 68px;
      background: white;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 20;
    }

    .header-inner {
      max-width: 1150px;
      height: 100%;
      margin: auto;
      padding: 0 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 15px;
    }

    .header-logo {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 20px;
      font-weight: 800;
    }

    .header-logo .logo-heart {
      width: 34px;
      height: 34px;
      border-radius: 11px;
      font-size: 17px;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .header-btn {
      border: 1px solid var(--border);
      background: white;
      border-radius: 11px;
      padding: 9px 13px;
      font-weight: 700;
      color: var(--text);
    }

    .logout-btn {
      color: var(--danger);
    }

    .app-layout {
      max-width: 1150px;
      margin: 0 auto;
      padding: 25px 18px 60px;
      display: grid;
      grid-template-columns: 230px minmax(0, 1fr) 230px;
      gap: 20px;
    }

    .sidebar-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 15px;
      margin-bottom: 15px;
    }

    .sidebar-title {
      font-size: 12px;
      text-transform: uppercase;
      letter-spacing: .08em;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 10px;
    }

    .side-item {
      width: 100%;
      border: none;
      background: transparent;
      text-align: left;
      padding: 11px 10px;
      border-radius: 10px;
      color: var(--text);
      font-weight: 650;
    }

    .side-item:hover,
    .side-item.active {
      background: var(--blue-light);
      color: var(--blue-dark);
    }

    .profile-mini {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .avatar {
      width: 42px;
      height: 42px;
      flex-shrink: 0;
      border-radius: 50%;
      background: var(--blue-light);
      color: var(--blue);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 800;
    }

    .profile-mini strong {
      display: block;
      font-size: 14px;
    }

    .profile-mini span {
      color: var(--muted);
      font-size: 12px;
    }

    /* ---------- FEED ---------- */

    .feed-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
      gap: 10px;
    }

    .feed-title h1 {
      font-size: 25px;
      margin-bottom: 3px;
    }

    .feed-title p {
      color: var(--muted);
      font-size: 13px;
    }

    .search-box {
      position: relative;
      margin-bottom: 15px;
    }

    .search-box input {
      width: 100%;
      padding: 13px 15px 13px 42px;
      border: 1px solid var(--border);
      background: white;
      border-radius: 13px;
      outline: none;
    }

    .search-icon {
      position: absolute;
      left: 15px;
      top: 12px;
      color: var(--muted);
    }

    .filters {
      display: flex;
      gap: 7px;
      overflow-x: auto;
      padding-bottom: 5px;
      margin-bottom: 15px;
    }

    .filter {
      white-space: nowrap;
      border: 1px solid var(--border);
      background: white;
      color: var(--muted);
      border-radius: 999px;
      padding: 8px 13px;
      font-size: 12px;
      font-weight: 700;
    }

    .filter.active {
      background: var(--blue);
      color: white;
      border-color: var(--blue);
    }

    /* ---------- CREATE POST ---------- */

    .create-card {
      background: white;
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 17px;
      margin-bottom: 16px;
    }

    .create-head {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 13px;
    }

    .create-head span {
      color: var(--muted);
      font-size: 13px;
    }

    .create-input {
      width: 100%;
      border: 1px solid var(--border);
      background: #fafbfe;
      border-radius: 12px;
      padding: 12px 13px;
      outline: none;
      margin
