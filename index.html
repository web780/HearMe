<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>HearMe 💙</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f7f8fc;
      color: #222;
      min-height: 100vh;
    }

    header {
      background: white;
      padding: 22px;
      text-align: center;
      border-bottom: 1px solid #eee;
    }

    header h1 {
      font-size: 32px;
      margin-bottom: 8px;
    }

    header p {
      color: #666;
    }

    main {
      max-width: 700px;
      margin: 40px auto;
      padding: 20px;
    }

    .welcome,
    .auth-box {
      background: white;
      padding: 30px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 20px rgba(0,0,0,0.05);
    }

    .welcome h2 {
      margin-bottom: 12px;
    }

    .welcome p {
      color: #666;
      line-height: 1.6;
      margin-bottom: 25px;
    }

    button {
      border: none;
      padding: 13px 22px;
      border-radius: 10px;
      background: #6c63ff;
      color: white;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    button:hover {
      opacity: 0.9;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0;
      border: 1px solid #ddd;
      border-radius: 10px;
      font-size: 16px;
    }

    .auth-box {
      display: none;
      margin-top: 25px;
    }

    .auth-box h2 {
      margin-bottom: 15px;
    }

    #authMessage {
      margin-top: 15px;
      color: #666;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      margin-top: 40px;
      padding-bottom: 30px;
      color: #888;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>HearMe 💙</h1>
    <p>A safe space to share and support.</p>
  </header>

  <main>

    <section class="welcome">
      <h2>You don't have to face everything alone.</h2>

      <p>
        Share what you're going through, listen to others,
        and find support in a safe and respectful community.
      </p>

      <button id="getStartedButton">
        Get Started
      </button>
    </section>


    <section id="authBox" class="auth-box">

      <h2>Welcome to HearMe 💙</h2>

      <input
        id="email"
        type="email"
        placeholder="Email"
        autocomplete="email"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <div>
        <button id="signUpButton">
          Sign Up
        </button>

        <button id="loginButton">
          Log In
        </button>
      </div>

      <p id="authMessage"></p>

    </section>

    <footer>
      © 2026 HearMe
    </footer>

  </main>


  <!-- Supabase library -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


  <script>

    // ==============================
    // SUPABASE CONFIGURATION
    // ==============================

    const SUPABASE_URL =
      "https://gtclqrxylsyvqtjipatl.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imd0Y2xxcnh5bHN5dnF0amlwYXRsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTAxNjI5OTIsImV4cCI6MjEwNTczODk5Mn0.njwDMMpnj7e1TF4RCDn6bEZNrOG5NS-qMiPuLvs2YMA";


    // Create Supabase client
    const supabaseClient =
      window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    // ==============================
    // ELEMENTS
    // ==============================

    const getStartedButton =
      document.getElementById("getStartedButton");

    const authBox =
      document.getElementById("authBox");

    const signUpButton =
      document.getElementById("signUpButton");

    const loginButton =
      document.getElementById("loginButton");

    const emailInput =
      document.getElementById("email");

    const passwordInput =
      document.getElementById("password");

    const authMessage =
      document.getElementById("authMessage");


    // ==============================
    // GET STARTED
    // ==============================

    getStartedButton.addEventListener("click", function () {

      authBox.style.display = "block";

      authBox.scrollIntoView({
        behavior: "smooth"
      });

    });


    // ==============================
    // SIGN UP
    // ==============================

    signUpButton.addEventListener("click", async function () {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {

        authMessage.textContent =
          "Please enter your email and password.";

        return;
      }

      authMessage.textContent =
        "Creating your account...";

      const { error } =
        await supabaseClient.auth.signUp({
          email: email,
          password: password
        });

      if (error) {

        authMessage.textContent =
          error.message;

        return;
      }

      authMessage.textContent =
        "Account created! Check your email to confirm your account. 💙";

    });


    // ==============================
    // LOG IN
    // ==============================

    loginButton.addEventListener("click", async function () {

      const email = emailInput.value.trim();
      const password = passwordInput.value;

      if (!email || !password) {

        authMessage.textContent =
          "Please enter your email and password.";

        return;
      }

      authMessage.textContent =
        "Logging in...";

      const { error } =
        await supabaseClient.auth.signInWithPassword({
          email: email,
          password: password
        });

      if (error) {

        authMessage.textContent =
          error.message;

        return;
      }

      authMessage.textContent =
        "You're logged in! Welcome to HearMe 💙";

    });

  </script>

</body>
</html>
